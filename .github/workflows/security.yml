# SEC-0010: CI ran typecheck, lint, test and build only, so a vulnerable
# dependency or a committed secret reached main unchallenged.
#
# Each job runs its scanner from a pinned container image rather than a
# third-party action, so there is no mutable action tag to hijack.
name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    # Monday 03:00 UTC: catches advisories published after a merge.
    - cron: '0 3 * * 1'

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks reads history, not just the tip.
          fetch-depth: 0
      - name: Scan the repository
        run: |
          docker run --rm -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.21.2 \
            detect --source=/repo --redact --no-banner --exit-code 1

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit
        run: pnpm audit --audit-level=high
      - name: osv-scanner
        run: |
          docker run --rm -v "$PWD:/src" \
            ghcr.io/google/osv-scanner:v1.9.1 \
            --lockfile=/src/pnpm-lock.yaml

  sast:
    name: Static analysis (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src \
            semgrep/semgrep:1.97.0 \
            semgrep scan --config p/typescript --config p/security-audit --error
