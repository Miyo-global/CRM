name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit
        continue-on-error: false

      - name: Run linter
        run: pnpm lint
        continue-on-error: false

      - name: Run tests
        run: pnpm test
        continue-on-error: false

      - name: Build application
        run: pnpm build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/db' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-build-only-placeholder-not-a-real-secret-abc123' }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL || 'http://localhost:3000' }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY || 'dummy_key' }}
          R2_REGION: ${{ secrets.R2_REGION || 'auto' }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || '' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY || '' }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT || '' }}

      - name: CI complete
        if: success()
        run: echo "✅ Type check, lint, and build all passed."

  schema-drift:
    name: Schema drift (MIYO-0003)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drift
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Replay every migration in order. Older files depend on tables that were
      # created by `drizzle-kit push`, so errors are tolerated here; those gaps
      # are listed in scripts/schema-drift-baseline.txt.
      - name: Replay migrations
        run: for f in drizzle/*.sql; do psql "$DATABASE_URL" -q -f "$f" >/dev/null 2>&1 || true; done
      - name: Check schema drift
        run: pnpm db:check-drift
